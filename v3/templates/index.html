<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>OMR Scanner</title>
<style>
  :root {
    --bg:      #0f1117;
    --surface: #1c1f2b;
    --border:  #2a2f42;
    --accent:  #4f8ef7;
    --green:   #22c55e;
    --red:     #ef4444;
    --orange:  #f97316;
    --text:    #e8eaf0;
    --muted:   #6b7280;
    --radius:  12px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100dvh;display:flex;flex-direction:column}

  /* ── Status bar ── */
  #status-bar{
    display:flex;align-items:center;gap:10px;
    padding:10px 14px;
    background:var(--surface);border-bottom:1px solid var(--border);
    font-size:13px;font-weight:600;letter-spacing:.3px;min-height:48px;
  }
  #status-dot{width:10px;height:10px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s}
  #status-dot.ready  {background:var(--green);box-shadow:0 0 6px var(--green)}
  #status-dot.busy   {background:var(--accent);box-shadow:0 0 6px var(--accent);animation:pulse 1s infinite}
  #status-dot.error  {background:var(--red)}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

  /* ── Camera area ── */
  #cam-wrap{position:relative;width:100%;background:#000;flex:1;min-height:0}
  #cam-video{width:100%;height:100%;object-fit:cover;display:block}
  #cam-canvas{display:none}

  /* Guide overlay */
  #guide{
    position:absolute;inset:0;pointer-events:none;
    display:flex;align-items:center;justify-content:center;
  }
  #guide-box{
    width:88%;max-width:420px;aspect-ratio:3/1.1;
    border:2px dashed rgba(79,142,247,.5);border-radius:8px;
    box-shadow:0 0 0 9999px rgba(0,0,0,.28);
  }

  /* Scan bar animation */
  #scan-line{
    position:absolute;left:6%;right:6%;height:2px;
    background:linear-gradient(90deg,transparent,var(--accent),transparent);
    border-radius:2px;display:none;
    animation:scan 1.6s ease-in-out infinite;
    top:50%;
  }
  @keyframes scan{
    0%  {top:20%;opacity:0}
    15% {opacity:1}
    85% {opacity:1}
    100%{top:80%;opacity:0}
  }

  /* ── Controls ── */
  #controls{
    padding:14px;background:var(--surface);
    border-top:1px solid var(--border);
    display:flex;gap:10px;
  }
  .btn{
    flex:1;padding:13px 8px;border:none;border-radius:var(--radius);
    font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.4px;
    transition:opacity .15s,transform .1s;
  }
  .btn:active{transform:scale(.96)}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-ghost  {background:var(--border);color:var(--text)}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  /* Auto badge */
  #auto-badge{
    font-size:11px;padding:3px 8px;border-radius:20px;
    background:var(--green);color:#000;font-weight:700;white-space:nowrap;
    align-self:center;flex-shrink:0;cursor:pointer;
  }
  #auto-badge.off{background:var(--border);color:var(--muted)}

  /* ── Result panel ── */
  #result-panel{
    background:var(--surface);border-top:1px solid var(--border);
    max-height:0;overflow:hidden;transition:max-height .4s ease;
  }
  #result-panel.open{max-height:75dvh;overflow-y:auto}

  .result-header{
    padding:14px 16px 8px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .score-big{font-size:36px;font-weight:800;line-height:1}
  .score-big.great{color:var(--green)}
  .score-big.mid  {color:var(--accent)}
  .score-big.low  {color:var(--red)}

  .score-meta{display:flex;gap:16px;padding:0 16px 12px;font-size:13px;color:var(--muted)}
  .score-meta span b{color:var(--text)}

  .answer-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(46px,1fr));
    gap:4px;padding:8px 16px 16px;
  }
  .ans-cell{
    background:var(--bg);border-radius:6px;padding:5px 2px;
    text-align:center;font-size:12px;line-height:1.3;border:1px solid var(--border);
  }
  .ans-cell .no {color:var(--muted);font-size:10px}
  .ans-cell .ltr{font-weight:700;font-size:15px}
  .ans-cell.ok   {border-color:var(--green);background:#052b14}
  .ans-cell.salah{border-color:var(--red);background:#2b0505}
  .ans-cell.ragu {border-color:var(--orange);background:#2b1505}
  .ans-cell.kosong{border-color:var(--muted)}

  .overlay-img{width:100%;display:block;padding:0 12px 12px}

  /* close btn */
  .close-btn{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px}

  /* error toast */
  #toast{
    position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);
    background:#2b0505;color:var(--red);border:1px solid var(--red);
    padding:10px 18px;border-radius:8px;font-size:13px;
    opacity:0;transition:all .3s;pointer-events:none;text-align:center;
    max-width:88vw;z-index:999;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<!-- Status bar -->
<div id="status-bar">
  <div id="status-dot"></div>
  <span id="status-txt">Memulai kamera...</span>
</div>

<!-- Camera -->
<div id="cam-wrap">
  <video id="cam-video" autoplay playsinline muted></video>
  <canvas id="cam-canvas"></canvas>

  <div id="guide">
    <div id="guide-box"></div>
  </div>
  <div id="scan-line"></div>
</div>

<!-- Controls -->
<div id="controls">
  <button class="btn btn-ghost"  id="btn-manual" disabled>📸 Jepret</button>
  <div id="auto-badge">⚡ AUTO</div>
</div>

<!-- Result panel -->
<div id="result-panel">
  <div class="result-header">
    <div>
      <div id="score-display" class="score-big">—</div>
      <div style="color:var(--muted);font-size:12px;margin-top:4px">NILAI</div>
    </div>
    <button class="close-btn" onclick="closeResult()">✕</button>
  </div>
  <div class="score-meta" id="score-meta"></div>
  <div class="answer-grid" id="answer-grid"></div>
  <img class="overlay-img" id="overlay-img" src="" alt="" style="display:none">
</div>

<div id="toast"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const video    = document.getElementById('cam-video');
const canvas   = document.getElementById('cam-canvas');
const ctx      = canvas.getContext('2d');
const dot      = document.getElementById('status-dot');
const statusTx = document.getElementById('status-txt');
const scanLine = document.getElementById('scan-line');
const panel    = document.getElementById('result-panel');
const autoBadge= document.getElementById('auto-badge');

let autoMode = true;
let scanning = false;
let autoTimer = null;
let keyLoaded = false;

// ── Kamera ─────────────────────────────────────────────────────────────────
async function startCamera() {
  setStatus('busy', 'Membuka kamera…');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width:{ideal:1920}, height:{ideal:1080} },
      audio: false
    });
    video.srcObject = stream;
    await video.play();
    setStatus('ready', 'Kamera aktif — arahkan lembar jawaban');
    document.getElementById('btn-manual').disabled = false;
    checkServerStatus();
    if (autoMode) scheduleAutoScan();
  } catch (e) {
    setStatus('error', 'Kamera gagal dibuka — izin kamera diblokir?');
    showToast('Izinkan akses kamera di browser, lalu refresh halaman.', 5000);
  }
}

// ── Scan ───────────────────────────────────────────────────────────────────
async function doScan() {
  if (scanning) return;
  scanning = true;
  clearTimeout(autoTimer);

  setStatus('busy', 'Memproses…');
  scanLine.style.display = 'block';
  dot.className = 'busy';

  canvas.width  = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0);
  const b64 = canvas.toDataURL('image/jpeg', 0.92);

  try {
    const res = await fetch('/api/scan', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({image: b64})
    });
    const data = await res.json();

    if (!data.success) {
      setStatus('ready', '⚠ ' + (data.error || 'Gagal baca grid'));
      showToast(data.error || 'Lembar tidak terdeteksi — posisikan lebih lurus & terang', 3000);
    } else {
      showResult(data);
      setStatus('ready', keyLoaded ? '✓ Selesai — lembar berikutnya siap' : '✓ Jawaban terbaca');
    }
  } catch (e) {
    setStatus('error', 'Koneksi ke server gagal');
    showToast('Tidak bisa hubungi server. Pastikan app.py masih berjalan.', 4000);
  }

  scanLine.style.display = 'none';
  scanning = false;
  if (autoMode && !panel.classList.contains('open')) scheduleAutoScan();
}

function scheduleAutoScan() {
  clearTimeout(autoTimer);
  autoTimer = setTimeout(doScan, 2500);
}

// ── Hasil ──────────────────────────────────────────────────────────────────
function showResult(data) {
  panel.classList.add('open');

  if (data.grade) {
    const g = data.grade;
    const el = document.getElementById('score-display');
    el.textContent = g.nilai;
    el.className   = 'score-big ' + (g.nilai>=75?'great':g.nilai>=50?'mid':'low');

    document.getElementById('score-meta').innerHTML =
      `<span><b>${g.benar}</b> benar</span>
       <span><b>${g.salah}</b> salah</span>
       <span><b>${g.kosong}</b> kosong</span>
       <span><b>${g.ragu}</b> ragu</span>
       <span>dari <b>${g.total}</b> soal</span>`;

    const grid = document.getElementById('answer-grid');
    grid.innerHTML = '';
    for (const {no, kunci, jawaban, hasil} of g.detail) {
      const cls = {BENAR:'ok',SALAH:'salah',RAGU:'ragu',KOSONG:'kosong'}[hasil]||'';
      const ltr = jawaban || '—';
      const badge = hasil==='SALAH' ? `<span style="font-size:9px;color:var(--green)">${kunci}</span>` : '';
      grid.innerHTML += `<div class="ans-cell ${cls}">
        <div class="no">${no}</div>
        <div class="ltr">${ltr}</div>
        ${badge}
      </div>`;
    }
  } else {
    document.getElementById('score-display').textContent = '–';
    document.getElementById('score-meta').textContent    = 'Tanpa kunci jawaban';
    const grid = document.getElementById('answer-grid');
    grid.innerHTML = '';
    for (const [no, {letter, status}] of Object.entries(data.answers)) {
      const cls = {OK:'ok',RAGU:'ragu',KOSONG:'kosong'}[status]||'';
      grid.innerHTML += `<div class="ans-cell ${cls}">
        <div class="no">${no}</div>
        <div class="ltr">${letter||'—'}</div>
      </div>`;
    }
  }

  const ov = document.getElementById('overlay-img');
  if (data.overlay) {
    ov.src = data.overlay; ov.style.display = 'block';
  } else {
    ov.style.display = 'none';
  }
}

function closeResult() {
  panel.classList.remove('open');
  if (autoMode) scheduleAutoScan();
}

// ── Auto toggle ────────────────────────────────────────────────────────────
autoBadge.addEventListener('click', () => {
  autoMode = !autoMode;
  autoBadge.className = autoMode ? '' : 'off';
  autoBadge.textContent = autoMode ? '⚡ AUTO' : '⏸ AUTO';
  if (autoMode && !panel.classList.contains('open')) scheduleAutoScan();
  else clearTimeout(autoTimer);
});

document.getElementById('btn-manual').addEventListener('click', () => {
  clearTimeout(autoTimer);
  doScan();
});

// ── Helpers ────────────────────────────────────────────────────────────────
function setStatus(type, msg) {
  dot.className = type;
  statusTx.textContent = msg;
}

function showToast(msg, ms=3000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

async function checkServerStatus() {
  try {
    const r = await fetch('/api/status');
    const d = await r.json();
    keyLoaded = d.key_loaded;
    if (!keyLoaded)
      showToast('Server aktif, tapi kunci jawaban tidak dimuat — nilai tidak dihitung.', 4000);
  } catch(e) {}
}

// ── Init ───────────────────────────────────────────────────────────────────
startCamera();
</script>
</body>
</html>
